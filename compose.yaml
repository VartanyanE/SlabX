services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: slabx
      POSTGRES_USER: slabx
      POSTGRES_PASSWORD: slabx
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slabx -d slabx"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - slabx-postgres:/var/lib/postgresql/data

volumes:
  slabx-postgres:
